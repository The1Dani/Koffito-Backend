name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Tests run against a real Postgres (they create their own koffito_test database).
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: koffito
          POSTGRES_PASSWORD: koffito
          POSTGRES_DB: koffito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koffito -d koffito"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.7"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  build_and_push:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
