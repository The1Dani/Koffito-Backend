[project]
name = "koffito"
version = "0.1.0"
description = "Koffito backend: FastAPI API in front of Supabase (auth + RLS-guarded data)"
readme = "README.md"
authors = [
    { name = "The1Dani", email = "daniel.canter2013@gmail.com" }
]
requires-python = "==3.14.7"
dependencies = [
    "aiosmtplib>=5.1.3",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.15.0",
]

[project.scripts]
koffito = "koffito:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # The Windows selector-loop policy (tests/conftest.py) is deprecated in 3.14 but still works.
    "ignore:.*EventLoopPolicy.*:DeprecationWarning",
    "ignore:.*event_loop_policy.*:DeprecationWarning",
    # Starlette 1.6 prefers httpx2 for its TestClient; httpx 0.28 still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
# Command-line tools talk to the operator on stdout; the email template is one HTML string.
"src/koffito/cli.py" = ["T201"]
"src/koffito/migrate.py" = ["T201"]
"src/koffito/auth/mailer.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]
