[project]
name = "koffito"
version = "0.1.0"
description = "Koffito backend: FastAPI API in front of Supabase (auth + RLS-guarded data)"
readme = "README.md"
authors = [
    { name = "The1Dani", email = "daniel.canter2013@gmail.com" }
]
requires-python = "==3.14.7"
dependencies = [
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.15.0",
]

[project.scripts]
koffito = "koffito:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]
