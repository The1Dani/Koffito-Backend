  db-migrate:
    dns:
      - 100.100.100.100
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@staging:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    # depends_on:
      # db:
      #   condition: service_healthy
    restart: "no"
  app:
    dns:
      - 100.100.100.100
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@staging:5432/${POSTGRES_DB}
    depends_on:
      # db:
      #   condition: service_healthy
