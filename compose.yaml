# Local run against the real Supabase project. `.env` supplies the secrets (see .env.example).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Behind a TLS-terminating proxy set ENFORCE_HTTPS=true and TRUSTED_HOSTS in .env; uvicorn
    # already runs with --proxy-headers (see Dockerfile).

  # Background jobs (matchmaking, venue assignment, reminders, event completion) need
  # SUPABASE_SERVICE_ROLE_KEY. They run here as their own service so `app` replicas never double
  # up; alternatively drop this service and set JOBS_ENABLED=true on exactly one `app` instance.
  jobs:
    build: .
    env_file:
      - .env
    command: ["python", "-m", "koffito.jobs", "all", "--loop"]
