# Local run against the real Supabase project. `.env` supplies the secrets (see .env.example).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Behind a TLS-terminating proxy set ENFORCE_HTTPS=true and TRUSTED_HOSTS in .env; uvicorn
    # already runs with --proxy-headers (see Dockerfile).

  # Background jobs (matchmaking, venue assignment, reminders) need SUPABASE_SERVICE_ROLE_KEY.
  # Either set JOBS_ENABLED=true on exactly one `app` instance, or run them as their own
  # service / cron entry so replicas never double up:
  # jobs:
  #   build: .
  #   env_file:
  #     - .env
  #   command: ["python", "-m", "koffito.jobs", "all", "--loop"]
